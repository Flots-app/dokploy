# Trivy exceptions. Every entry needs a statement; vulnerabilities also need an
# expiry so the exception cannot outlive the debt it tracks.
#
# There is no `vulnerabilities:` section on purpose. The baseline recorded when
# Trivy was adopted (2026-10-24) expired on 2026-11-21 and turned the gate red,
# as designed; it was cleared by upgrading, not by renewing it: Node.js base
# image, pnpm, Docker, Railpack, pack and esbuild. Do not bring it back to make a
# red run green. If an advisory has no fix to upgrade to, add an entry like:
#
#   vulnerabilities:
#     - id: CVE-YYYY-NNNNN
#       purls:
#         - "pkg:golang/stdlib@v1.2.3"
#       expired_at: YYYY-MM-DD
#       statement: "why it is not exploitable here, and what to upgrade once a fix ships"
#
# Scope every vulnerability entry with `purls` (package and exact version): an
# unscoped ID would also hide the same advisory in a package where it is new.
# purls match in the repository scan and in the image scan alike.

secrets:
  - id: private-key
    paths:
      - "apps/dokploy/components/dashboard/settings/certificates/handle-certificate.tsx"
      # The same constant, compiled into the Next.js build of the image.
      - "**/.next/**/dashboard/settings/certificates*.js"
    statement: "False positive: UI placeholder constant holding sample text, not a real key"

misconfigurations:
  - id: DS-0002
    paths:
      - "ops/compose-preview/firewall/Dockerfile"
    statement: "Root by design: the agent programs iptables (NET_ADMIN, NET_RAW on the host network namespace). It runs read-only, with no-new-privileges and only those two capabilities, and is not reachable from PR workloads"
  - id: DS-0002
    paths:
      - "ops/compose-preview/worker/Dockerfile"
    statement: "Root by design: a Docker-in-Docker engine (dockerd requires root, privileged container). Documented in ops/compose-preview/README.md as not a boundary for hostile tenants; only same-repository PRs from authors with write access run there"
