# Trivy exceptions. Every entry needs a statement; vulnerabilities also need an
# expiry so the exception cannot outlive the debt it tracks.
#
# Baseline recorded when Trivy was adopted (2026-10-24): CRITICAL findings that
# already shipped. They stop being ignored on the expiry date, which turns the
# scheduled Trivy run red until the dependency is upgraded. Do not extend an
# expiry without a linked tracking issue; upgrade the dependency instead.
#
# Scope every vulnerability entry with `purls` (package and exact version): an
# unscoped ID would also hide the same advisory in a package where it is new.
# purls match in the repository scan and in the image scan alike.

vulnerabilities:
  - id: CVE-2025-29927
    purls:
      - "pkg:npm/next@14.1.4"
    expired_at: 2026-11-21
    statement: "Adoption baseline, upgrade required: next@14.1.4 -> 13.5.9, 14.2.25, 15.2.3, 12.3.5"
