minimumLimaVersion: 2.0.0

base:
  - template:_images/ubuntu-lts

cpus: 4
memory: 6GiB
disk: 40GiB

user:
  name: dokploy

ssh:
  localPort: 22221
  loadDotSSHPubKeys: false
  forwardAgent: false

mounts: []

networks:
  - lima: user-v2

containerd:
  system: false
  user: false

provision:
  - mode: system
    file: provision/common.sh
  - mode: system
    file: provision/build.sh

probes:
  - mode: readiness
    description: Docker and Docker Compose are available
    script: |
      #!/usr/bin/env bash
      set -e
      sudo docker info >/dev/null
      sudo docker compose version >/dev/null

message: |
  Build VM ready. Dokploy reaches it at 127.0.0.1:22221 as user dokploy.
