name: Release Fork

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version committed in apps/dokploy/package.json (for example v0.29.14-flots.1)
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/flots-app/dokploy

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      sha-tag: ${{ steps.release.outputs.sha-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source and version
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/canary" ]; then
            echo "Releases must be dispatched from the canary branch" >&2
            exit 1
          fi

          version="$(jq --raw-output .version apps/dokploy/package.json)"
          if ! [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version in apps/dokploy/package.json: $version" >&2
            exit 1
          fi
          if [ "$REQUESTED_VERSION" != "$version" ]; then
            echo "Requested version does not match apps/dokploy/package.json" >&2
            exit 1
          fi

          git fetch --force --tags origin
          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            echo "Tag already exists: $version" >&2
            exit 1
          fi
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha-tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Prepare production environment
        run: |
          set -euo pipefail
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Build and push architecture image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          build-args: |
            DOKPLOY_RELEASE_REPOSITORY=${{ github.repository }}
            DOKPLOY_IMAGE_REPOSITORY=${{ env.IMAGE_NAME }}
            RELEASE_TAG=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest architecture image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          push-to-registry: true

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Publish multi-architecture manifest
        id: manifest
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA_TAG: ${{ needs.prepare.outputs.sha-tag }}
        run: |
          set -euo pipefail

          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:${SHA_TAG}" \
            "${IMAGE_NAME}:${VERSION}-amd64" \
            "${IMAGE_NAME}:${VERSION}-arm64"

          raw_manifest="${RUNNER_TEMP}/manifest.json"
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:${VERSION}" > "$raw_manifest"
          platforms="$(
            jq --raw-output \
              '[.manifests[].platform
                | select(.os == "linux")
                | select(.architecture == "amd64" or .architecture == "arm64")
                | "\(.os)/\(.architecture)"]
               | unique
               | sort
               | join(",")' \
              "$raw_manifest"
          )"
          if [ "$platforms" != "linux/amd64,linux/arm64" ]; then
            echo "Published manifest is missing an architecture: $platforms" >&2
            exit 1
          fi

          digest="$(
            docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" \
              | awk '$1 == "Digest:" { print $2; exit }'
          )"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Could not resolve the published manifest digest" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          jq --null-input \
            --arg version "$VERSION" \
            --arg image "${IMAGE_NAME}:${VERSION}" \
            --arg digest "$digest" \
            --arg source "$GITHUB_REPOSITORY" \
            --arg revision "$GITHUB_SHA" \
            '{
              version: $version,
              image: $image,
              digest: $digest,
              source: $source,
              revision: $revision,
              platforms: ["linux/amd64", "linux/arm64"]
            }' > release-metadata.json

      - name: Attest multi-architecture image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          subject-version: ${{ needs.prepare.outputs.version }}
          push-to-registry: true

      - name: Verify published attestation
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh attestation verify \
              "oci://${IMAGE_NAME}@${DIGEST}" \
              --repo "$GITHUB_REPOSITORY"; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Published image attestation could not be verified" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          files: release-metadata.json
