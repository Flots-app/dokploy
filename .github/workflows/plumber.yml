# Plumber validates committed GitHub Actions configuration without executing
# repository code. Daily runs also detect upstream action CVEs and archival drift.
name: Plumber Compliance

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main, canary]
  push:
    branches: [main, canary]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plumber:
    name: Plumber compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce Plumber compliance
        uses: getplumber/plumber@ef9864df81f444647d95889d98695434f6fa9732 # v0.4.12
        with:
          version: v0.4.12
          verify-attestation: true
          config-file: .plumber.yaml
          metadata-token: ${{ secrets.PLUMBER_METADATA_TOKEN }}
          min-points: 100
          fail-warnings: true
          soft-fail: false
          score: true
          score-push: false
          # Keep SARIF in the private artifact bundle unless Code Scanning
          # ingestion is deliberately enabled for this repository.
          upload-sarif: false
          upload-artifacts: true
          artifact-name: plumber-report-${{ github.run_id }}-${{ github.run_attempt }}
