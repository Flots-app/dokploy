# Plumber validates committed GitHub Actions configuration. The companion guard
# enforces Socket Firewall coverage for dependency installs in every workflow.
name: Plumber Compliance

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main, canary]
  push:
    branches: [main, canary]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plumber:
    name: Plumber compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce Socket Firewall coverage
        run: |
          python3 .github/scripts/test_check_socket_firewall.py
          python3 .github/scripts/check_socket_firewall.py

      - name: Enforce Plumber compliance
        uses: getplumber/plumber@59d586ada029ab9691105c5a6aa803ef04c00d07 # v0.4.23
        with:
          version: v0.4.23
          verify-attestation: true
          config-file: .plumber.yaml
          metadata-token: ${{ secrets.PLUMBER_METADATA_TOKEN }}
          min-points: 100
          fail-warnings: true
          soft-fail: false
          score: true
          score-push: false
          # Keep SARIF in the private artifact bundle unless Code Scanning
          # ingestion is deliberately enabled for this repository.
          upload-sarif: false
          upload-artifacts: true
          artifact-name: plumber-report-${{ github.run_id }}-${{ github.run_attempt }}
