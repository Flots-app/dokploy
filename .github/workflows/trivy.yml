# Trivy scans the repository (lockfiles, Dockerfiles, secrets) and the image that
# release.yml ships. Policy, in short:
#   - a secret, or a CRITICAL finding that has a fix, always fails the run;
#   - a change may not add HIGH findings compared with its base branch;
#   - everything else lands in Code Scanning without blocking.
# The decision is made by .github/scripts/trivy_gate.py; trivy.yaml and
# .trivyignore.yaml hold the scanner settings and the dated exceptions.
name: Trivy

on:
  pull_request:
    branches: [main, canary]
  push:
    branches: [main, canary]
  schedule:
    # New advisories land every day, so unchanged code is rescanned nightly.
    - cron: "41 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "regression blocks new HIGH findings, strict blocks every fixable HIGH finding"
        type: choice
        options:
          - regression
          - strict
        default: regression

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/flots-app/dokploy
  TRIVY_GATE_MODE: ${{ inputs.mode || 'regression' }}
  TRIVY_NO_PROGRESS: "true"
  TRIVY_DISABLE_TELEMETRY: "true"

jobs:
  trivy-repository:
    name: Trivy repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as a merge commit; its first parent is
          # the exact base the change is compared with.
          fetch-depth: 2
          persist-credentials: false

      - name: Install checksum-verified Trivy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install-trivy.sh

      - name: Test the Trivy gate
        run: python3 -B .github/scripts/test_trivy_gate.py

      - name: Scan the repository
        run: |
          set -euo pipefail
          trivy fs . \
            --config trivy.yaml \
            --include-dev-deps \
            --format json \
            --output "${RUNNER_TEMP}/repository.json"

      - name: Scan the base branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          base_dir="${RUNNER_TEMP}/base"
          mkdir -p "$base_dir"
          git archive HEAD^1 | tar --extract --directory "$base_dir"

          # Same database, same policy files, so the comparison only reflects
          # what the pull request changed.
          trivy fs "$base_dir" \
            --config trivy.yaml \
            --ignorefile "${PWD}/.trivyignore.yaml" \
            --include-dev-deps \
            --skip-db-update \
            --skip-check-update \
            --format json \
            --output "${RUNNER_TEMP}/base.json"

      - name: Build the SARIF report and the SBOM
        run: |
          set -euo pipefail
          trivy convert \
            --format sarif \
            --output "${RUNNER_TEMP}/repository.sarif" \
            "${RUNNER_TEMP}/repository.json"
          trivy fs . \
            --config trivy.yaml \
            --scanners vuln \
            --skip-db-update \
            --skip-check-update \
            --format cyclonedx \
            --output "${RUNNER_TEMP}/repository.cdx.json"

      - name: Upload to Code Scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/repository.sarif
          category: trivy-repository

      - name: Keep the reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-repository
          path: |
            ${{ runner.temp }}/repository.json
            ${{ runner.temp }}/repository.sarif
            ${{ runner.temp }}/repository.cdx.json
          retention-days: 30

      - name: Enforce the Trivy policy
        run: |
          set -euo pipefail
          args=(--head "${RUNNER_TEMP}/repository.json" --label repository --mode "$TRIVY_GATE_MODE" --summary "$GITHUB_STEP_SUMMARY")
          if [ -f "${RUNNER_TEMP}/base.json" ]; then
            args+=(--base "${RUNNER_TEMP}/base.json")
          fi
          python3 -B .github/scripts/trivy_gate.py "${args[@]}"

  trivy-image:
    name: Trivy image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare production environment
        run: |
          set -euo pipefail
          cp apps/dokploy/.env.production.example .env.production
          cp apps/dokploy/.env.production.example apps/dokploy/.env.production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the release image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_NAME }}:trivy
          build-args: |
            DOKPLOY_RELEASE_REPOSITORY=${{ github.repository }}
            DOKPLOY_IMAGE_REPOSITORY=${{ env.IMAGE_NAME }}
            RELEASE_TAG=latest

      - name: Install checksum-verified Trivy
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/install-trivy.sh

      - name: Scan the image
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:trivy"
          trivy image "$image" \
            --config trivy.yaml \
            --format json \
            --output "${RUNNER_TEMP}/image.json"
          trivy convert \
            --format sarif \
            --output "${RUNNER_TEMP}/image.sarif" \
            "${RUNNER_TEMP}/image.json"

          # Licenses are reported, not enforced: the baseline is unknown.
          trivy image "$image" \
            --scanners license \
            --severity HIGH,CRITICAL \
            --skip-db-update \
            --skip-check-update \
            --format json \
            --output "${RUNNER_TEMP}/image-licenses.json"
          {
            echo '### Trivy image: forbidden licenses'
            echo '```'
            trivy image "$image" \
              --scanners license \
              --severity CRITICAL \
              --skip-db-update \
              --skip-check-update \
              --format table \
              --quiet | head -c 20000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload to Code Scanning
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/image.sarif
          category: trivy-image

      - name: Keep the reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-image
          path: |
            ${{ runner.temp }}/image.json
            ${{ runner.temp }}/image.sarif
            ${{ runner.temp }}/image-licenses.json
          retention-days: 30

      - name: Enforce the Trivy policy
        run: |
          set -euo pipefail
          python3 -B .github/scripts/trivy_gate.py \
            --head "${RUNNER_TEMP}/image.json" \
            --label image \
            --mode "$TRIVY_GATE_MODE" \
            --summary "$GITHUB_STEP_SUMMARY"
