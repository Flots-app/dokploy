name: CI

on:
  pull_request:
    branches: [main, canary]
  push:
    branches: [main, canary]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.job }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - job: quality
            command: format-and-lint
          - job: build
            command: build
          - job: test
            command: test:ci
          - job: typecheck
            command: typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.0
          cache: "pnpm"

      - name: Set up Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          shims: "false"

      - name: Install checksum-verified Nixpacks
        if: matrix.job == 'test'
        env:
          NIXPACKS_VERSION: "1.41.0"
          NIXPACKS_SHA256: "194bcad8c379f78a309eee1a88b2e6b2abc59f354efe7ecd7b4bbaf21de99a06"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/nixpacks.tar.gz"
          url="https://github.com/railwayapp/nixpacks/releases/download/v${NIXPACKS_VERSION}/nixpacks-v${NIXPACKS_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$url"
          printf '%s  %s\n' "$NIXPACKS_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar --extract --gzip --file "$archive" --directory "$HOME/.local/bin" nixpacks

      - name: Install checksum-verified Railpack
        if: matrix.job == 'test'
        env:
          RAILPACK_VERSION: "0.15.4"
          RAILPACK_SHA256: "459d86f5a9d8698bee8c7be4f224a305f51158fe5f44eb528255dfd568e4eaf1"
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/railpack.tar.gz"
          url="https://github.com/railwayapp/railpack/releases/download/v${RAILPACK_VERSION}/railpack-v${RAILPACK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$url"
          printf '%s  %s\n' "$RAILPACK_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$HOME/.local/bin"
          tar --extract --gzip --file "$archive" --directory "$HOME/.local/bin" railpack

      - name: Add build tools to PATH
        if: matrix.job == 'test'
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify build tools
        if: matrix.job == 'test'
        run: |
          nixpacks --version
          railpack --version

      - name: Initialize Docker Swarm
        if: matrix.job == 'test'
        run: |
          set -euo pipefail
          docker swarm init
          docker network create --driver overlay dokploy-network || true

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Build shared server package
        if: matrix.job != 'quality'
        run: pnpm server:build

      - name: Run ${{ matrix.job }}
        run: pnpm ${{ matrix.command }}

      - name: Test the build server and CI pool watchdogs
        if: matrix.job == 'test'
        run: node --test ops/build-server-watchdog/*.test.mjs ops/ci-pool-watchdog/*.test.mjs

  # The unit tests mock the database: here the migrations run on an empty
  # PostgreSQL, then the services and routers are tested against it.
  database:
    name: database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # The major version Dokploy deploys (packages/server/src/setup/postgres-setup.ts).
        image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: dokploy
          POSTGRES_DB: dokploy_test
          # Throwaway database of this job only: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dokploy -d dokploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://dokploy@localhost:5432/dokploy_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.4.0
          cache: "pnpm"

      - name: Set up Socket Firewall
        uses: SocketDev/action@2d3f25590c6ed6ba11a9a14c064d962a3a04698f # v1.3.1
        with:
          mode: firewall-free
          shims: "false"

      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile

      - name: Apply every migration to the empty database
        working-directory: apps/dokploy
        run: |
          set -euo pipefail
          # migration.ts prints a failure without exiting non-zero: check its output.
          pnpm migration:run 2>&1 | tee "$RUNNER_TEMP/migration.log"
          grep -qx "Migration complete" "$RUNNER_TEMP/migration.log"

      - name: Test the services and routers against PostgreSQL
        working-directory: apps/dokploy
        run: pnpm test:db
