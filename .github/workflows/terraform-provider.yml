name: Terraform Provider

# Internal Terraform provider of the Flots Dokploy fork (ops/terraform-provider-dokploy).
# - Pull requests touching it: format, vet and tests, the tests running the real
#   Terraform binary against an in-memory fake of the Dokploy API.
# - Tags terraform-provider-dokploy/vX.Y.Z: the same checks, then release
#   archives for the platforms the iac-infra pipelines and the operators use,
#   a SHA256SUMS file, a build attestation and a GitHub release.
#   iac-infra downloads that release into a Terraform filesystem mirror.
on:
  pull_request:
    paths:
      - ops/terraform-provider-dokploy/**
      - .github/workflows/terraform-provider.yml
  push:
    tags:
      - terraform-provider-dokploy/v*

concurrency:
  group: terraform-provider-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.16.0
  # sha256 of terraform_<version>_linux_amd64.zip, from the release's
  # terraform_<version>_SHA256SUMS; update both together.
  TERRAFORM_SHA256: 41d05b927aa174f15d1228c4eba832a323b716c68b415ef5a00179f46cc602d3

jobs:
  test:
    name: Format, vet and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ops/terraform-provider-dokploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ops/terraform-provider-dokploy/go.mod
          cache-dependency-path: ops/terraform-provider-dokploy/go.sum

      # The tests drive the real Terraform binary. hashicorp/setup-terraform is not
      # an authorized action (.plumber.yaml): the release archive is downloaded
      # and checked against the SHA-256 pinned above instead.
      - name: Install Terraform
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL -o terraform.zip \
            "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          echo "${TERRAFORM_SHA256}  terraform.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/terraform-bin"
          unzip -q terraform.zip terraform -d "$RUNNER_TEMP/terraform-bin"
          echo "$RUNNER_TEMP/terraform-bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: TF_ACC_TERRAFORM_PATH="$(command -v terraform)" go test -race -count=1 ./...

  release:
    name: Release
    if: github.ref_type == 'tag'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      artifact-metadata: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ops/terraform-provider-dokploy/go.mod
          # A release must not restore a cache an earlier run (a pull request)
          # could have poisoned.
          cache: false

      - name: Build the archives
        id: build
        working-directory: ops/terraform-provider-dokploy
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#terraform-provider-dokploy/v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag $TAG is not terraform-provider-dokploy/vX.Y.Z"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            binary="terraform-provider-dokploy_v${version}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" -o "$RUNNER_TEMP/$binary" .
            (cd "$RUNNER_TEMP" && zip -q "dist/terraform-provider-dokploy_${version}_${os}_${arch}.zip" "$binary")
            rm -f "$RUNNER_TEMP/$binary"
          done
          (cd "$RUNNER_TEMP/dist" && sha256sum ./*.zip | sed 's# \./# #' > "terraform-provider-dokploy_${version}_SHA256SUMS")
          cat "$RUNNER_TEMP/dist/terraform-provider-dokploy_${version}_SHA256SUMS"

      - name: Attest the archives
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/dist/*.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP"/dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Terraform provider dokploy v${VERSION}" \
            --notes "Internal Terraform provider for the Flots Dokploy fork. Install into a Terraform filesystem mirror (see ops/terraform-provider-dokploy/README.md)." \
            --latest=false
