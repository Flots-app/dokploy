name: GHCR Access Probe

on:
  push:
    branches:
      - codex/fork-ci-releases

permissions:
  contents: read
  packages: write

jobs:
  probe:
    name: Probe ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        package:
          - dokploy
          - dokploy-fork
    steps:
      - name: Log in with the repository token
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Pull and push a technical tag
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          source="ghcr.io/flots-app/${PACKAGE}:repository-link-3fb1d213b"
          target="ghcr.io/flots-app/${PACKAGE}:actions-access-probe-${GITHUB_SHA::12}"
          docker pull "$source"
          docker tag "$source" "$target"
          docker push "$target"
